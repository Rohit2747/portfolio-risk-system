# ============================================
# RISK ANALYSIS SERVICE CONFIGURATION
# ============================================
spring.application.name=risk-analysis-service
server.port=8082

# URLs of other services
portfolio.service.url=http://localhost:8080
market.data.service.url=http://localhost:8081

# ============================================
# AWS CONFIGURATION
# Set these via environment variables in production.
# For local dev: set aws.enabled=false to skip AWS calls.
# For AWS: set aws.enabled=true and provide region + credentials.
# ============================================

# Master AWS switch: false = local mode (no AWS calls)
#                    true  = real AWS SDK calls
aws.enabled=${AWS_ENABLED:false}

# AWS Region (used by all AWS SDK clients)
aws.region=${AWS_REGION:us-east-1}

# ============================================
# CloudWatch Logs Configuration
# ============================================
cloudwatch.log.group=/portfolio-risk/risk-analysis-service
cloudwatch.log.stream=risk-events

# ============================================
# SNS Configuration
# Replace ACCOUNT_ID with your actual AWS Account ID
# ============================================
sns.topic.arn.risk-threshold-breached=${SNS_RISK_TOPIC_ARN:arn:aws:sns:us-east-1:ACCOUNT_ID:risk-threshold-breached}

# ============================================
# Logging
# ============================================
logging.level.com.incedo.risk_analysis_service=INFO
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
