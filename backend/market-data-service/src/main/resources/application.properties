# ============================================
# MARKET DATA SERVICE CONFIGURATION
# ============================================
spring.application.name=market-data-service
server.port=8081

# ============================================
# AWS CONFIGURATION
# ============================================
aws.enabled=${AWS_ENABLED:false}
aws.region=${AWS_REGION:us-east-1}

# SNS Topic for PriceUpdated events
# Replace ACCOUNT_ID with your actual AWS Account ID
sns.topic.arn.price-updated=${SNS_PRICE_TOPIC_ARN:arn:aws:sns:us-east-1:ACCOUNT_ID:price-updated}

# ============================================
# Logging
# ============================================
logging.level.com.incedo.market_data_service=INFO
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
