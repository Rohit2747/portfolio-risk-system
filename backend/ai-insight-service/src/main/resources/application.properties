# ============================================
# AI INSIGHT SERVICE CONFIGURATION
# ============================================
spring.application.name=ai-insight-service
server.port=8083

# Risk Analysis Service URL (for REST fallback polling)
risk.analysis.service.url=http://localhost:8082

# ============================================
# AWS CONFIGURATION
# ============================================
aws.enabled=${AWS_ENABLED:false}
aws.region=${AWS_REGION:us-east-1}

# ============================================
# SQS Configuration
# Replace ACCOUNT_ID with your actual AWS Account ID.
# This queue must be subscribed to SNS topic: risk-threshold-breached
# ============================================
sqs.queue.url=${SQS_RISK_QUEUE_URL:https://sqs.us-east-1.amazonaws.com/ACCOUNT_ID/ai-insight-queue}

# SQS polling interval (ms) — how often to check for new messages
sqs.poll.interval.ms=5000

# ============================================
# AI Provider Configuration
# Options: MOCK (default) | OPENAI | BEDROCK
# ============================================
ai.provider=${AI_PROVIDER:MOCK}

# OpenAI Configuration (used when ai.provider=OPENAI)
# Set via environment variable: export OPENAI_API_KEY=sk-...
openai.api.key=${OPENAI_API_KEY:}
openai.model=gpt-3.5-turbo
openai.base.url=https://api.openai.com/v1
openai.max.tokens=512

# Amazon Bedrock Configuration (used when ai.provider=BEDROCK)
# Uses DefaultCredentialsProvider (IAM role on EC2/ECS or ~/.aws/credentials)
bedrock.model.id=anthropic.claude-3-sonnet-20240229-v1:0

# ============================================
# Logging
# ============================================
logging.level.com.incedo.ai_insight_service=INFO
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
